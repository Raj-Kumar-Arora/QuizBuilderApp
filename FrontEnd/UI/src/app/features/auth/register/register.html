<div class="page-container" >
  <div class="page-title">Register</div>

@if (loading) {
    <div style="color: rgb(38, 155, 64); font-weight: bold; font-size: 1.3rem;">Loading...{{ error }}</div>
}

 <form [formGroup]="form" (ngSubmit)="submit()" class="form-box">

    <label>Username</label>
    <input class="input" formControlName="username" />

    <label>Email</label>
    <input type="email" formControlName="email" />

    <label>Password</label>
    <input type="password" formControlName="password" />

    <div >
      <button class="btn btn-primary" type="submit">Register</button>
    </div>

    <div class="error-text" *ngIf="error">{{ error }}</div>
  </form>
</div>
