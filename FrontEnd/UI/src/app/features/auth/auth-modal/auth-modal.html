<div class="backdrop" (click)="closeModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="closeModal()">×</button>

    <app-login *ngIf="mode === 'login'" (loggedIn)="closeModal()"></app-login>
    <app-register *ngIf="mode === 'register'" (registered)="closeModal()"></app-register>
  </div>
</div>
