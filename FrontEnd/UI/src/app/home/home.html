<section class="home-container">
  <h2>Welcome to Quiz Builder</h2>
  <p>Create, publish and share quizzes easily!</p>

<div class="quiz-box">
  <label>ENTER QUIZ URL  (Full / 6 Chars Code)</label>
  <div class="quiz-input-row">
    <input
      type="text"
      placeholder="https://localhost:4200/take/xyz123"
      [(ngModel)]="quizUrl"
    />
    <button class="btn-primary" (click)="openQuiz()">Open Quiz</button>

    <div class="error-text" *ngIf="error">{{ error }}</div>
  </div>
</div>
</section>
